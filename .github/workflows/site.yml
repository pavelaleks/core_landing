name: site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages, API and HF packages are up to date
        run: python3 -I tools/build_site.py --check
      - name: Every local link resolves
        run: python3 -I tools/check_links.py
      - name: JavaScript parses
        run: node --experimental-vm-modules tools/check_js.mjs
      - name: JavaScript module behavior
        run: node --experimental-vm-modules --test tests/modules.test.mjs tests/auth.test.mjs
      - name: Native module versioning
        run: python3 -I tests/test_build_modules.py
