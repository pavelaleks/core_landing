name: site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages, API and HF packages are up to date
        run: python3 -I tools/build_site.py --check
      - name: Every local link resolves
        run: python3 -I tools/check_links.py
      - name: JavaScript parses
        run: |
          for f in assets/app.js assets/graph3d.js assets/catalog-page.js assets/regions-page.js assets/how-page.js app/app.js; do node --check "$f"; done
